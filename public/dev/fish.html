<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Fish Isle — catálogo de arte dos peixes</title>
<style>
  body { margin: 0; padding: 16px; background: #eaf6f4; font: 13px/1.3 system-ui, sans-serif; color: #16424a; }
  h2 { margin: 18px 0 8px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
  .card > canvas { width: 100%; height: auto; }
  .card { background: #fff; border-radius: 12px; padding: 8px; box-shadow: 0 2px 6px rgba(0,0,0,.08); }
  .row { display: flex; align-items: center; gap: 6px; }
  .name { font-weight: 700; margin-top: 4px; }
  .r { font-size: 11px; opacity: .75; }
  canvas, img { display: block; }
  .icon { background: repeating-conic-gradient(#e9eef0 0 25%, #fff 0 50%) 0 0/12px 12px; border-radius: 6px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module">
  import { SPECIES } from '/shared/fish.js';
  import { ISLANDS, ISLAND_ORDER } from '/shared/islands.js';
  import { RARITIES } from '/shared/config.js';
  import { fishImage } from '/js/art/fishArt.js';
  const root = document.getElementById('root');
  const t0 = performance.now();
  for (const isl of ISLAND_ORDER) {
    const h = document.createElement('h2'); h.textContent = ISLANDS[isl].name; root.appendChild(h);
    const grid = document.createElement('div'); grid.className = 'grid'; root.appendChild(grid);
    for (const s of SPECIES.filter((x) => x.island === isl)) {
      const card = document.createElement('div'); card.className = 'card';
      card.appendChild(fishImage(s.id, 'card', 240));
      const row = document.createElement('div'); row.className = 'row';
      const ic = fishImage(s.id, 'icon', 48); ic.className = 'icon'; row.appendChild(ic);
      row.appendChild(fishImage(s.id, 'sprite', 72));
      row.appendChild(fishImage(s.id, 'icon', 48, true));
      card.appendChild(row);
      const n = document.createElement('div'); n.className = 'name'; n.textContent = s.name; card.appendChild(n);
      const r = document.createElement('div'); r.className = 'r'; r.textContent = `${RARITIES[s.rarity].symbol} ${RARITIES[s.rarity].label}`; card.appendChild(r);
      grid.appendChild(card);
    }
  }
  document.title += ` (${(performance.now() - t0).toFixed(0)} ms)`;
  window.__done = true;
</script>
</body>
</html>
